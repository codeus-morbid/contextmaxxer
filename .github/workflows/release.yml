name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            os: ubuntu-24.04
            artifact: contextmaxxer_linux_amd64
          - name: Windows amd64
            os: windows-2025
            artifact: contextmaxxer_windows_amd64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.5.0
        with:
          go-version: '1.25.x'
          cache: true

      - name: Set up Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0

      - name: Cache tokenizer build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            libs
            .task/tokenizers-target
            ~/.cargo/git
            ~/.cargo/registry
          key: tokenizer-${{ runner.os }}-${{ hashFiles('scripts/build-tokenizers.sh', 'scripts/build-win-tokenizers.ps1') }}

      - name: Build
        run: task build

      - name: Stage release documentation
        shell: bash
        run: cp LICENSE THIRD_PARTY_NOTICES.md .task/build/

      - name: Package Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: tar -C .task/build -czf "contextmaxxer_${GITHUB_REF_NAME}_linux_amd64.tar.gz" contextmaxxer LICENSE THIRD_PARTY_NOTICES.md

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path .task/build/contextmaxxer.exe,.task/build/LICENSE,.task/build/THIRD_PARTY_NOTICES.md -DestinationPath "contextmaxxer_${env:GITHUB_REF_NAME}_windows_amd64.zip"

      - name: Upload release asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: contextmaxxer_*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: contextmaxxer_*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: cd dist && sha256sum contextmaxxer_* > checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
