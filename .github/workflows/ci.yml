name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            os: ubuntu-24.04
          - name: Windows amd64
            os: windows-2025
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.5.0
        with:
          go-version: '1.25.x'
          cache: true

      - name: Set up Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0

      - name: Cache tokenizer build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            libs
            .task/tokenizers-target
            ~/.cargo/git
            ~/.cargo/registry
          key: tokenizer-${{ runner.os }}-${{ hashFiles('scripts/build-tokenizers.sh', 'scripts/build-win-tokenizers.ps1') }}

      - name: Bootstrap native tokenizer
        run: task bootstrap

      - name: Verify formatting
        shell: bash
        run: test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: task test

      - name: Build
        run: task build

      - name: Cache ONNX runtime and models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/contextmaxxer
            ~/AppData/Local/contextmaxxer
          key: onnx-${{ runner.os }}-${{ hashFiles('internal/embed/model.go', 'internal/rerank/onnx.go') }}

      - name: MCP handshake
        shell: bash
        env:
          # No GPU on the runners. The CPU runtime still catches an ORT API
          # mismatch, which is the failure this step exists for.
          CONTEXTMAXXER_ORT_PROVIDER: cpu
        run: bash scripts/mcp-handshake.sh
